<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>OMERIZ Store - Modern App Gallery</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark">
  <!-- Title Bar Windows Style -->
  <div class="title-bar">
      <div class="window-title">OMERIZ Store v2.0</div>
      <div class="window-controls">
          <div class="window-control close" onclick="window.close()">
              <i class="fas fa-times"></i>
          </div>
      </div>
  </div>
  
  <!-- Main Container -->
  <div class="main-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">OS</div>
          <div class="logo-text">OMERIZ Store</div>
        </div>
      </div>
      
      <ul class="sidebar-menu">
        <li><a href="#" class="active" data-filter="all"><i class="fas fa-home"></i> Beranda</a></li>
        <li><a href="#" data-filter="recent"><i class="fas fa-clock"></i> Terbaru</a></li>
        <li><a href="#" data-filter="popular"><i class="fas fa-fire"></i> Populer</a></li>
      </ul>
      
      <div class="sidebar-footer">
        <div class="theme-switch-wrapper" id="themeToggleSidebar">
          <i class="fas fa-sun"></i>
          <span>Light Mode</span>
          <div class="theme-switch">
            <div class="theme-switch-handle"></div>
          </div>
        </div>
        <div class="storage-info">
          <i class="fas fa-database"></i>
          <span id="storageCount">0 Files</span>
        </div>
      </div>
    </aside>
    
    <!-- Main Content -->
    <div class="main-content">
      <!-- Header -->
      <header>
        <div class="header-title">
          <h1>OMERIZ Store</h1>
          <p>Download OMERIZ mu Secara Cepat Dan Aman</p>
        </div>
        
        <div class="header-actions">
          <button class="btn btn-secondary" id="sortBtn">
            <i class="fas fa-sort-amount-down"></i> <span>Sort by Date</span>
          </button>
          <button class="btn btn-secondary" id="viewToggle">
            <i class="fas fa-list"></i> <span>List View</span>
          </button>
        </div>
      </header>
      
      <!-- Search Section -->
      <section class="search-section">
        <div class="search-container">
          <div class="search-icon">
            <i class="fas fa-search"></i>
          </div>
          <input type="search" id="filter" placeholder="Cari file..." />
          <button class="search-btn" id="searchBtn">
            <i class="fas fa-search"></i> <span>Cari</span>
          </button>
          <button class="clear-btn" id="clearSearch" style="display: none;">
            <i class="fas fa-times"></i> <span>Hapus</span>
          </button>
        </div>
        <div class="stats">
          <span id="fileCount">Memuat data file...</span>
          <span id="filterInfo"></span>
        </div>
      </section>
      
      <!-- Apps Grid/List View -->
      <div class="apps-container" id="appsContainer">
        <div class="apps-grid" id="appsGrid">
          <div class="loading">
            <div class="spinner"></div>
          </div>
        </div>
      </div>
      
      <!-- Pagination -->
      <div class="pagination">
        <button id="prevBtn" disabled>
          <i class="fas fa-chevron-left"></i> <span>Sebelumnya</span>
        </button>
        <span id="pageInfo">Halaman 1 dari 1</span>
        <button id="nextBtn" disabled>
          <span>Berikutnya</span> <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    </div>
  </div>
  
  <!-- App Detail Modal -->
  <div class="modal" id="appDetailModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Detail File</h2>
        <button class="close-modal">&times;</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Konten detail file akan dimuat di sini -->
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toastMessage"></span>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
